name: Bug report
description: Something in Standflow isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Rhythm
        2. ...
    validations:
      required: true
  - type: input
    id: standflow-version
    attributes:
      label: Standflow version
      description: You can find
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or rec
      description: Optional, but they help a lot.
